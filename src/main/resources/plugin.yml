main: me.hiyo41.itemtimer.ItemTimer
name: ItemTimer
version: '${project.version}'
api-version: '1.21'
author: Hiyo41
description: Cosmetic countdown timers above dropped items with optional early removal.
website: https://github.com/hiyo41/ItemTimer
commands:
  itemtimer:
    description: Main command for ItemTimer
    aliases: [it]
permissions:
  itemtimer.admin:
    description: Allows reloading the configuration and checking for updates
    default: op
